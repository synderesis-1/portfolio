<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fernanda Brunelli — Portfólio</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-deep: #050505;
      --bg-card: #121212;
      --border-color: #262626;
      --text-main: #f5f5f7;
      --text-muted: #b0b0b5;
    }

    body {
      background-color: var(--bg-deep);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }

    /* Navbar Estilo Minimalista */
    .navbar {
      background-color: rgba(5, 5, 5, 0.9) !important;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
    }

    .navbar-brand, .nav-link {
      color: var(--text-main) !important;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .nav-link:hover {
      color: #fff !important;
    }

    /* Banner Superior Original */
    .hero-banner {
      width: 100%;
      height: 280px;
      overflow: hidden;
      position: relative;
      border-bottom: 1px solid var(--border-color);
    }

    .hero-banner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Avatar Circular Sobreposto na Borda (Aumentado) */
    .profile-container {
      position: relative;
      margin-top: -75px;
      margin-bottom: 2rem;
      text-align: center;
      z-index: 3;
    }

    .avatar-wrapper {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      border: 4px solid var(--bg-deep);
      background-color: #1a1a1a;
      overflow: hidden;
      margin: 0 auto;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    .avatar-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Textos nítidos */
    .profile-bio {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* Links Sociais Estilo Pill */
    .pill-link {
      background-color: #1a1a1a;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 18px;
      border-radius: 50rem;
      font-size: 0.85rem;
      text-decoration: none;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .pill-link:hover {
      background-color: #262626;
      color: #fff;
      border-color: #404040;
    }

    /* Cards Bento Grid Padronizados com Efeito Hover de Escala de Cinza */
    .bento-card {
      border: 1px solid var(--border-color);
      border-radius: 20px;
      overflow: hidden;
      transition: transform 0.25s ease, border-color 0.25s ease, filter 0.6s ease;
      position: relative;
      text-decoration: none;
      height: 280px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      filter: grayscale(100%);
    }

    .bento-card:hover {
      transform: translateY(-4px);
      border-color: #404040;
      filter: grayscale(0%);
    }

    /* Gradientes customizados para cada plataforma (Garantido para não falhar) */
    .card-letterboxd {
      background: linear-gradient(135deg, #14181c 0%, #00e054 60%, #ff8000 120%);
    }

    .card-goodreads {
      background: linear-gradient(135deg, #24190e 0%, #38220f 50%, #f4f1ea 150%);
    }

    .card-tryhackme {
      background: linear-gradient(135deg, #101722 0%, #1f2937 50%, #b81414 150%);
    }

    .card-github {
      background: linear-gradient(135deg, #0d1117 0%, #1f2328 50%, #30363d 150%);
    }

    .bento-card-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to top, rgba(5,5,5,0.95) 20%, rgba(5,5,5,0.3) 70%);
      z-index: 1;
    }

    .bento-content {
      position: relative;
      z-index: 2;
      padding: 1.5rem;
    }

    .bento-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 0.2rem;
    }

    .bento-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* Abas de Habilidades */
    .nav-pills .nav-link.active {
      background-color: #fff !important;
      color: #000 !important;
      font-weight: 600;
    }
