<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fernanda Brunelli — Portfólio</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-deep: #050505;
      --bg-card: #121212;
      --border-color: #262626;
      --text-main: #f5f5f7;
      --text-muted: #b0b0b5;
    }

    body {
      background-color: var(--bg-deep);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }

    /* Navbar Estilo Minimalista */
    .navbar {
      background-color: rgba(5, 5, 5, 0.9) !important;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
    }

    .navbar-brand, .nav-link {
      color: var(--text-main) !important;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .nav-link:hover {
      color: #fff !important;
    }

    /* Banner Superior com Imagem Real */
    .hero-banner {
      width: 100%;
      height: 280px;
      overflow: hidden;
      position: relative;
      border-bottom: 1px solid var(--border-color);
    }

    .hero-banner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Avatar Circular Sobreposto na Borda (Escala Aumentada) */
    .profile-container {
      position: relative;
      margin-top: -75px;
      margin-bottom: 2rem;
      text-align: center;
      z-index: 3;
    }

    .avatar-wrapper {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      border: 4px solid var(--bg-deep);
      background-color: #1a1a1a;
      overflow: hidden;
      margin: 0 auto;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    .avatar-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Textos nítidos */
    .profile-bio {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* Links Sociais Estilo Pill */
    .pill-link {
      background-color: #1a1a1a;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 18px;
      border-radius: 50rem;
      font-size: 0.85rem;
      text-decoration: none;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .pill-link:hover {
      background-color: #262626;
      color: #fff;
      border-color: #404040;
    }

    /* Cards Bento Grid (Proporcionados) */
    .bento-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      overflow: hidden;
      transition: transform 0.25s ease, border-color 0.25s ease;
      position: relative;
      text-decoration: none;
      height: 280px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .bento-card:hover {
      transform: translateY(-4px);
      border-color: #404040;
    }

    .bento-card-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
      opacity: 0.85;
      filter: grayscale(100%);
      transition: filter 0.6s ease, transform 0.3s ease;
    }

    .bento-card:hover .bento-card-bg {
      filter: grayscale(0%);
    }

    .bento-card-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to top, rgba(5,5,5,0.95) 15%, rgba(5,5,5,0.2) 70%);
      z-index: 2;
    }

    .bento-content {
      position: relative;
      z-index: 3;
      padding: 1.5rem;
    }

    .bento-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 0.2rem;
    }

    .bento-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* Abas de Habilidades */
    .nav-pills .nav-link.active {
      background-color: #fff !important;
      color: #000 !important;
      font-weight: 600;
    }
    .nav-pills .nav-link {
      color: var(--text-main);
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      margin-right: 8px;
      margin-bottom: 8px;
    }

    /* Modais e Formulário */
    .modal-content {
      background-color: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 16px;
    }
    .modal-header, .modal-footer {
      border-color: var(--border-color);
    }
    .btn-close {
      filter: invert(1) grayscale(100%) brightness(200%);
    }

    .form-control {
      background-color: #1a1a1a;
      border: 1px solid var(--border-color);
      color: #fff;
    }
    .form-control:focus {
      background-color: #1a1a1a;
      border-color: #666;
      color: #fff;
      box-shadow: none;
    }

    footer {
      border-top: 1px solid var(--border-color);
      color: var(--text-muted);
      font-size: 0.85rem;
    }
  </style>
</head>

          <li class="nav-item"><a class="nav-link" href="#projetos">Projetos</a></li>
          <li class="nav-item"><a class="nav-link" href="#contato">Contato</a></li>
